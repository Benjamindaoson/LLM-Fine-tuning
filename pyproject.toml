[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-llm-finetuning"
version = "1.0.0"
description = "Financial-domain SFT, distributed LoRA training, evaluation, vLLM serving and LLMOps"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Jianming Lai"}]
dependencies = [
  "torch>=2.8",
  "transformers>=5.3.0,<6",
  "peft>=0.18.0",
  "accelerate>=1.10.0",
  "deepspeed>=0.17.0",
  "datasets>=4.0.0",
  "huggingface_hub>=0.34.0",
  "safetensors>=0.5.0",
  "sentencepiece>=0.2.0",
  "protobuf>=5.0",
  "pyarrow>=20.0.0",
  "httpx>=0.28.0",
  "openai>=1.100.0",
  "pandas>=2.3.0",
  "pyyaml>=6.0",
  "tensorboard>=2.20.0",
]

[project.optional-dependencies]
serve = ["vllm>=0.16.0"]
dev = ["pytest>=8.4.0", "ruff>=0.12.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"
